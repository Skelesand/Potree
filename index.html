<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="Local Potree Viewer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TWG Point Cloud Viewer</title>

    <link rel="stylesheet" type="text/css" href="./build/potree/potree.css">
    <link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
    <link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
    <link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">
    <style>
        :root {
            --site-header-height: 76px;
            --site-header-background: #000000;
            --site-brand-gold: #d8ab4e;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        .site-header {
            position: relative;
            z-index: 11000;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
            width: 100%;
            height: var(--site-header-height);
            padding: 0 32px;
            background: var(--site-header-background);
            border-bottom: 3px solid var(--site-brand-gold);
        }

        .site-brand {
            display: inline-flex;
            flex: 0 0 auto;
            align-items: center;
        }

        .site-brand img {
            display: block;
            width: 164px;
            height: auto;
        }

        .site-nav {
            display: flex;
            align-items: center;
            gap: clamp(16px, 2.2vw, 32px);
            height: 100%;
        }

        .site-nav a {
            display: inline-flex;
            align-items: center;
            height: 100%;
            color: #f5f3ed;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-decoration: none;
            white-space: nowrap;
            transition: color 140ms ease;
        }

        .site-nav a:hover,
        .site-nav a:focus-visible {
            color: var(--site-brand-gold);
        }

        .site-nav a:focus-visible,
        .site-brand:focus-visible {
            outline: 2px solid var(--site-brand-gold);
            outline-offset: 4px;
        }

        .potree_container {
            position: absolute;
            top: var(--site-header-height);
            right: 0;
            bottom: 0;
            left: 0;
        }

        #potree_sidebar_container {
            z-index: 2;
        }

        #control_mode_switch {
            display: flex;
            gap: 8px;
            padding: 10px;
            border-bottom: 1px solid #444;
        }

        .control-mode-button {
            position: relative;
            z-index: 1;
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--site-brand-gold);
            border-radius: 3px;
            background: #222;
            color: #f5f3ed;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            background-color: #222;
        }

        .control-mode-button:hover {
            background-color: #444;
        }

        .control-mode-button:active {
            background-color: #b58b35;
        }

        .control-mode-button.is-active {
            background-color: var(--site-brand-gold);
            color: #111;
        }

        .control-mode-button:focus-visible {
            outline: 2px solid #f5f3ed;
            outline-offset: 2px;
        }

        #simple_tools_panel {
            display: none;
            padding: 0 10px 12px;
        }

        #sidebar_root.simple-controls #simple_tools_panel {
            display: block;
        }

        #sidebar_root.simple-controls #potree_menu > h3:not(#menu_about),
        #sidebar_root.simple-controls #potree_menu > h3:not(#menu_about) + div,
        #sidebar_root.simple-controls #sidebar_content > div:not(#potree_menu):not(#simple_tools_panel) {
            display: none !important;
        }

        #simple_tools_panel .simple-tool-section {
            margin-top: 8px;
        }

        #simple_tools_panel .simple-tool-section > div:not(.divider) {
            min-height: 34px;
        }

        #simple_point_budget_slider,
        #simple_splat_quality_select {
            box-sizing: border-box;
            width: 100%;
        }

        #simple_measurement_tools img,
        #simple_volume_clipping img,
        #simple_cube_views img {
            width: 32px;
            height: 32px;
            margin: 2px;
            vertical-align: middle;
        }

        .simple-tool-button {
            margin: 0;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        .simple-tool-button:focus-visible {
            outline: 2px solid var(--site-brand-gold);
            outline-offset: 2px;
        }

        #simple_attribute_select {
            box-sizing: border-box;
            width: 100%;
            padding: 6px;
        }

        #sidebar_root.simple-controls #menu_about_content {
            display: block !important;
        }

        @media (max-width: 760px) {
            :root {
                --site-header-height: 100px;
            }

            .site-header {
                flex-direction: column;
                justify-content: center;
                gap: 2px;
                padding: 6px 16px 0;
            }

            .site-brand img {
                width: 132px;
            }

            .site-nav {
                box-sizing: border-box;
                justify-content: flex-start;
                gap: 20px;
                width: 100%;
                min-height: 36px;
                overflow-x: auto;
                scrollbar-width: none;
            }

            .site-nav::-webkit-scrollbar {
                display: none;
            }

            .site-nav a {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <script src="./libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="./libs/spectrum/spectrum.js"></script>
    <script src="./libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="./libs/jstree/jstree.min.js"></script>
    <script src="./libs/three.js/build/three.min.js"></script>
    <script src="./libs/other/BinaryHeap.js"></script>
    <script src="./libs/tween/tween.min.js"></script>
    <script src="./libs/d3/d3.js"></script>
    <script src="./libs/proj4/proj4.js"></script>
    <script src="./libs/openlayers3/ol.js"></script>
    <script src="./libs/i18next/i18next.js"></script>
    <script src="./build/potree/potree.js"></script>
    <script src="./libs/plasio/js/laslaz.js"></script>

    <header class="site-header">
        <a class="site-brand" href="https://wassigroup.com/" aria-label="The Wassi Group home">
            <img src="https://wassigroup.com/wp-content/uploads/2026/02/GOLD-TWG-Name-Logo-Services-Vector-Image-1-20-26.svg" alt="The Wassi Group">
        </a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="https://wassigroup.com/?page_id=23">Contact</a>
            <a href="https://wassigroup.com/?page_id=58">Services</a>
            <a href="https://wassigroup.com/?page_id=584">About Us</a>
            <a href="https://wassigroup.com/?page_id=22">Projects</a>
            <a href="https://wassigroup.com/wassi-group-blog/">Insights</a>
            <a href="https://www.twgplanroom.com/">Planroom</a>
        </nav>
    </header>

    <div class="potree_container">
        <div id="potree_render_area"></div>
        <div id="potree_sidebar_container"></div>
    </div>

    <script>
        window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
        viewer.useHQ = true;
        viewer.setPointBudget(5 * 1000 * 1000);
        viewer.setLengthUnit("ft");

        viewer.setEDLEnabled(true);
        let pointcloud;
        const selectPointCloudInScene = () => {
            if (!pointcloud) {
                return;
            }

            const sceneTree = $("#jstree_scene").jstree(true);
            if (!sceneTree) {
                return;
            }

            const pointCloudsNode = sceneTree.get_node("pointclouds");
            if (!pointCloudsNode) {
                return;
            }

            const pointCloudNode = pointCloudsNode.children
                .map(nodeID => sceneTree.get_node(nodeID))
                .find(node => node.data === pointcloud);
            const isPointCloudSelected = sceneTree.get_selected()
                .some(nodeID => sceneTree.get_node(nodeID).data === pointcloud);
            if (pointCloudNode && !isPointCloudSelected) {
                sceneTree.select_node(pointCloudNode.id);
            }
        };

        const syncSimpleAttributeSelect = () => {
            const attributeSelect = document.getElementById("simple_attribute_select");
            if (!attributeSelect || !pointcloud) {
                return;
            }

            const hasIntensity = pointcloud.pcoGeometry.pointAttributes.attributes
                .some(attribute => attribute.name === "intensity");
            attributeSelect.disabled = false;
            attributeSelect.querySelector('option[value="intensity gradient"]').disabled = !hasIntensity;
            attributeSelect.value = pointcloud.material.activeAttributeName;
        };

        const initializeSimpleTools = () => {
            const addSimpleToolButtons = (sourceSelector, filenames, targetSelector, labels) => {
                const source = document.querySelector(sourceSelector);
                const target = document.querySelector(targetSelector);
                if (!source || !target) {
                    throw new Error(`Could not initialize simple tools in ${sourceSelector}.`);
                }
                for (const [index, filename] of filenames.entries()) {
                    const icon = Array.from(source.querySelectorAll("img"))
                        .find(image => image.getAttribute("src").endsWith(filename));
                    if (!icon) {
                        throw new Error(`Could not find Potree tool icon: ${filename}`);
                    }

                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "simple-tool-button";
                    button.setAttribute("aria-label", labels[index]);
                    button.title = labels[index];
                    const image = icon.cloneNode();
                    image.alt = "";
                    button.appendChild(image);
                    button.addEventListener("click", () => icon.click());
                    target.appendChild(button);
                }
            };

            const pointBudgetContainer = document.getElementById("simple_point_budget");
            const qualityContainer = document.getElementById("simple_splat_quality");
            if (!pointBudgetContainer || !qualityContainer) {
                throw new Error("Could not find Simple point-cloud control containers.");
            }

            let pointBudgetSlider = document.getElementById("simple_point_budget_slider");
            let pointBudgetLabel = document.getElementById("simple_point_budget_label");
            if (!pointBudgetSlider || !pointBudgetLabel) {
                const listItem = document.createElement("li");
                const label = document.createElement("label");
                label.htmlFor = "simple_point_budget_slider";
                label.append("Point budget: ");
                pointBudgetLabel = document.createElement("span");
                pointBudgetLabel.id = "simple_point_budget_label";
                label.appendChild(pointBudgetLabel);
                pointBudgetSlider = document.createElement("input");
                pointBudgetSlider.id = "simple_point_budget_slider";
                pointBudgetSlider.type = "range";
                pointBudgetSlider.min = "100000";
                pointBudgetSlider.max = "10000000";
                pointBudgetSlider.step = "1000";
                listItem.append(label, pointBudgetSlider);
                pointBudgetContainer.appendChild(listItem);
            }

            let splatQualitySelect = document.getElementById("simple_splat_quality_select");
            if (!splatQualitySelect) {
                splatQualitySelect = document.createElement("select");
                splatQualitySelect.id = "simple_splat_quality_select";
                splatQualitySelect.setAttribute("aria-label", "Splat quality");
                for (const [value, label] of [["standard", "Standard"], ["hq", "High Quality"]]) {
                    const option = document.createElement("option");
                    option.value = value;
                    option.textContent = label;
                    splatQualitySelect.appendChild(option);
                }

                const listItem = document.createElement("li");
                listItem.appendChild(splatQualitySelect);
                qualityContainer.appendChild(listItem);
            }

            pointBudgetSlider.value = viewer.getPointBudget();
            pointBudgetLabel.textContent = Number(pointBudgetSlider.value).toLocaleString();
            pointBudgetSlider.addEventListener("input", () => {
                viewer.setPointBudget(Number(pointBudgetSlider.value));
            });
            viewer.addEventListener("point_budget_changed", () => {
                pointBudgetSlider.value = viewer.getPointBudget();
                pointBudgetLabel.textContent = Number(pointBudgetSlider.value).toLocaleString();
            });

            splatQualitySelect.value = viewer.useHQ ? "hq" : "standard";
            splatQualitySelect.addEventListener("change", () => {
                viewer.useHQ = splatQualitySelect.value === "hq";
            });

            addSimpleToolButtons("#tools", ["distance.svg", "height.svg"],
                "#simple_measurement_tools", ["Distance Measurement", "Height Measurement"]);
            addSimpleToolButtons("#clipping_tools", ["clip_volume.svg"],
                "#simple_volume_clipping", ["Volume Clipping"]);
            addSimpleToolButtons("#navigation", ["left.svg", "right.svg", "front.svg", "back.svg", "top.svg", "bottom.svg"],
                "#simple_cube_views", ["Left View", "Right View", "Front View", "Back View", "Top View", "Bottom View"]);

            viewer.navigationCube.visible = true;

            const attributeSelect = document.getElementById("simple_attribute_select");
            attributeSelect.addEventListener("change", () => {
                if (pointcloud) {
                    pointcloud.material.activeAttributeName = attributeSelect.value;
                }
            });

            syncSimpleAttributeSelect();
        };

        document.addEventListener("click", event => {
            const button = event.target instanceof Element
                ? event.target.closest("[data-control-mode]")
                : null;
            const sidebar = button?.closest("#sidebar_root");
            if (!button || !sidebar) {
                return;
            }

            const isSimple = button.dataset.controlMode === "simple";
            sidebar.classList.toggle("simple-controls", isSimple);
            sidebar.querySelectorAll("[data-control-mode]").forEach(modeButton => {
                const isActive = modeButton === button;
                modeButton.classList.toggle("is-active", isActive);
                modeButton.setAttribute("aria-pressed", String(isActive));
            });

            if (isSimple) {
                const qualitySelect = document.getElementById("simple_splat_quality_select");
                if (qualitySelect) {
                    qualitySelect.value = viewer.useHQ ? "hq" : "standard";
                }
                syncSimpleAttributeSelect();
            }
            viewer.navigationCube.visible = true;
        });

        viewer.loadGUI(() => {
            viewer.setLanguage("en");
            $("#menu_appearance").next().show();
            $("#menu_scene").next().show();

            initializeSimpleTools();

            selectPointCloudInScene();
        });

        // Load your converted point cloud metadata (replace 'my_cloud' with your actual folder name)
        Potree.loadPointCloud("./pointclouds/Class_Test/metadata.json", "MyScan", e => {
            pointcloud = e.pointcloud;
            let material = pointcloud.material;
            
            material.size = 1.5;
            material.pointSizeType = Potree.PointSizeType.FIXED;
            material.activeAttributeName = "rgba";
            syncSimpleAttributeSelect();
            
            viewer.scene.addPointCloud(pointcloud);
            viewer.fitToScreen();
            selectPointCloudInScene();
        });
    </script>
</body>
</html>
